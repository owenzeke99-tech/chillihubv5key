
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090606">
<title>Chilli Hub V5</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --red: #ff302b;
  --orange: #ff792d;
  --gold: #ffbd58;
  --bg: #090606;
  --muted: #a99999;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px 16px;
  overflow-x: hidden;
  color: #fff;
  background:
    radial-gradient(ellipse at 50% 38%, #48100e 0%, transparent 43%),
    radial-gradient(ellipse at 10% 90%, #29100c 0%, transparent 40%),
    #090606;
  font-family: 'Inter', sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .14;
  background-image: radial-gradient(#ff8060 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: linear-gradient(to bottom, transparent, black, transparent);
}

.ambient {
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: #ff321c;
  filter: blur(115px);
  opacity: .15;
  pointer-events: none;
  animation: ambient 6s ease-in-out infinite alternate;
}

.ambient.left {
  left: -160px;
  top: 10%;
}

.ambient.right {
  right: -160px;
  bottom: 5%;
  background: #ff782b;
  animation-delay: -3s;
}

.spark {
  position: fixed;
  bottom: -15px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 10px var(--orange);
  pointer-events: none;
  animation: rise linear infinite;
}

.s1 { left: 8%; animation-duration: 8s; }
.s2 { left: 19%; animation-duration: 11s; animation-delay: -4s; }
.s3 { left: 34%; animation-duration: 9s; animation-delay: -2s; }
.s4 { left: 64%; animation-duration: 10s; animation-delay: -6s; }
.s5 { left: 79%; animation-duration: 8s; animation-delay: -1s; }
.s6 { left: 92%; animation-duration: 12s; animation-delay: -5s; }

.wrapper {
  width: 100%;
  max-width: 400px;
  position: relative;
  animation: enter .9s cubic-bezier(.2,.8,.2,1) both;
}

.card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 30px 24px 23px;
  border-radius: 25px;
  border: 1px solid #ff553c45;
  background: linear-gradient(150deg, #1d1111f5, #0d0909f7 75%);
  box-shadow:
    0 25px 80px #0009,
    0 0 50px #ff31120b,
    inset 0 1px 0 #ffffff0b;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 70%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #ffb17a, transparent);
  animation: scan 5s ease-in-out infinite;
}

.card::after {
  content: "";
  position: absolute;
  z-index: -1;
  width: 230px;
  height: 230px;
  top: -180px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #ff302b;
  filter: blur(90px);
  opacity: .18;
}

/* Unified chilli + flame emblem */
.logo-wrap {
  width: 118px;
  height: 118px;
  position: relative;
  margin: 0 auto 17px;
  display: grid;
  place-items: center;
  animation: levitate 3.6s ease-in-out infinite;
}

.logo-ring {
  position: absolute;
  inset: 7px;
  border-radius: 36px;
  border: 1px solid #ff69494a;
  background: linear-gradient(145deg, #421411, #170a09);
  box-shadow:
    0 0 35px #ff2e181d,
    inset 0 0 24px #ff5a2520;
  transform: rotate(-7deg);
}

.logo-ring::before {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: 40px;
  border: 1px solid #ff633520;
  animation: ringPulse 2.5s ease-in-out infinite;
}

.logo-svg {
  width: 83px;
  height: 90px;
  position: relative;
  z-index: 2;
  overflow: visible;
  filter: drop-shadow(0 0 8px #ff392a65);
}

.flame-main {
  transform-origin: 50% 80%;
  animation: flameDance 2s ease-in-out infinite alternate;
}

.flame-inner {
  animation: innerGlow 1.5s ease-in-out infinite alternate;
}

.logo-caption {
  position: absolute;
  bottom: -1px;
  z-index: 3;
  padding: 4px 9px;
  border: 1px solid #ff593b50;
  border-radius: 20px;
  background: #160a09;
  color: #ffb17c;
  font: 700 8px 'Orbitron', sans-serif;
  letter-spacing: 2px;
}

h1 {
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(24px, 7vw, 30px);
  line-height: 1.4;
  font-weight: 900;
  letter-spacing: 1.5px;
}

h1 .chilli {
  color: #fff5ee;
  text-shadow: 0 0 22px #ff5b3430;
}

h1 .hub {
  color: #ff4934;
  text-shadow: 0 0 22px #ff352d55;
}

h1 .v5 {
  display: inline-block;
  color: #ffb16b;
  font-size: .75em;
  vertical-align: 4px;
  margin-left: 2px;
}

.underline {
  width: 76px;
  height: 3px;
  margin: 12px auto 13px;
  border-radius: 10px;
  background: linear-gradient(90deg, #ff382b, #ffbd58);
  box-shadow: 0 0 15px #ff462d75;
  animation: lineGlow 2s ease-in-out infinite alternate;
}

.subtitle {
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  line-height: 1.8;
}

.status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 23px 0;
  color: #ffb7a5;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ff533e;
  box-shadow: 0 0 12px #ff533e;
  animation: blink 1.4s infinite;
}

.label {
  margin-bottom: 10px;
  color: #ddceca;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
}

.key-box {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px;
  min-width: 0;
  border-radius: 12px;
  border: 1px solid #ff553b38;
  background: #090606;
  box-shadow: inset 0 0 20px #ff302b07;
  transition: .3s ease;
}

.key-box:focus-within,
.key-box:hover {
  border-color: #ff725c9c;
  box-shadow: 0 0 20px #ff352319;
}

.key-text {
  flex: 1;
  min-width: 0;
  color: #ffb4a1;
  font-size: 11px;
  line-height: 1.9;
  overflow-wrap: anywhere;
  user-select: text;
}

.key-icon {
  flex-shrink: 0;
  font-size: 18px;
  animation: keyFloat 2.5s ease-in-out infinite;
}

.copy-button {
  position: relative;
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  overflow: hidden;
  border: 1px solid #ff79614f;
  border-radius: 12px;
  background: linear-gradient(105deg, #e92724, #ff4b2d 50%, #ff782e);
  background-size: 180% 100%;
  color: #fff;
  font: 800 11px 'Orbitron', sans-serif;
  letter-spacing: 1.5px;
  cursor: pointer;
  box-shadow: 0 6px 24px #ff322c2d;
  transition: transform .25s, box-shadow .25s, background-position .5s;
}

.copy-button::before {
  content: "";
  position: absolute;
  top: -60%;
  left: -45%;
  width: 25%;
  height: 220%;
  transform: rotate(25deg);
  background: #ffffff38;
  transition: left .6s ease;
}

.copy-button:hover {
  transform: translateY(-2px);
  background-position: 100% 0;
  box-shadow: 0 10px 32px #ff322c50;
}

.copy-button:hover::before {
  left: 125%;
}

.copy-button:active {
  transform: scale(.98);
}

.message {
  min-height: 17px;
  margin-top: 11px;
  text-align: center;
  font-size: 11px;
  color: #ff9d88;
}

.divider {
  height: 1px;
  margin: 18px 0;
  background: linear-gradient(90deg, transparent, #ff62462e, transparent);
}

.footer {
  text-align: center;
  color: #786967;
  font-size: 9px;
  letter-spacing: 1.5px;
}

.footer span {
  color: #ff6548;
  font-weight: 800;
}

@keyframes enter {
  from { opacity: 0; transform: translateY(24px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes levitate {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

@keyframes flameDance {
  from { transform: rotate(-2deg) scale(1); }
  to { transform: rotate(2deg) scale(1.035); }
}

@keyframes innerGlow {
  from { opacity: .8; }
  to { opacity: 1; }
}

@keyframes ringPulse {
  0%, 100% { opacity: .3; transform: scale(1); }
  50% { opacity: .85; transform: scale(1.04); }
}

@keyframes lineGlow {
  from { box-shadow: 0 0 8px #ff462d35; }
  to { box-shadow: 0 0 20px #ff462d85; }
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: .35; }
}

@keyframes scan {
  0%, 20% { left: -100%; }
  70%, 100% { left: 140%; }
}

@keyframes ambient {
  from { transform: scale(.85); opacity: .1; }
  to { transform: scale(1.15); opacity: .2; }
}

@keyframes rise {
  0% { transform: translateY(0) scale(.5); opacity: 0; }
  15% { opacity: .85; }
  80% { opacity: .5; }
  100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
}

@keyframes keyFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

@media (max-width: 360px) {
  .card { padding: 25px 17px 21px; }
  .logo-wrap { transform: scale(.94); margin-bottom: 12px; }
  h1 { letter-spacing: .5px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<div class="ambient left"></div>
<div class="ambient right"></div>

<div class="spark s1"></div>
<div class="spark s2"></div>
<div class="spark s3"></div>
<div class="spark s4"></div>
<div class="spark s5"></div>
<div class="spark s6"></div>

<main class="wrapper">
  <section class="card">

    <div class="logo-wrap">
      <div class="logo-ring"></div>

      <!-- Custom combined flame and chilli logo -->
      <svg class="logo-svg" viewBox="0 0 100 110"
           xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="Chilli and flame logo">
        <defs>
          <linearGradient id="fire" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#e92220"/>
            <stop offset="48%" stop-color="#ff4a26"/>
            <stop offset="100%" stop-color="#ffc05c"/>
          </linearGradient>
          <linearGradient id="pepper" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffb94d"/>
            <stop offset="35%" stop-color="#ff512b"/>
            <stop offset="100%" stop-color="#d71920"/>
          </linearGradient>
          <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#a8e66a"/>
            <stop offset="100%" stop-color="#3d9b4c"/>
          </linearGradient>
        </defs>

        <!-- Outer flame surrounds the pepper -->
        <g class="flame-main">
          <path d="M51 5
                   C57 19 77 26 78 46
                   C88 62 76 86 59 95
                   C43 104 21 94 17 77
                   C12 61 22 48 31 38
                   C29 52 35 57 39 60
                   C42 44 39 29 51 5Z"
                fill="url(#fire)"/>

          <path d="M53 34
                   C58 46 69 53 67 67
                   C66 79 57 87 47 87
                   C35 86 28 77 31 66
                   C34 57 43 52 43 42
                   C48 48 49 53 49 57
                   C56 51 55 42 53 34Z"
                fill="#ffb24b" opacity=".95"/>

          <path class="flame-inner"
                d="M50 61
                   C58 68 58 77 51 82
                   C44 85 38 78 42 71
                   C45 67 48 65 50 61Z"
                fill="#fff0bd"/>
        </g>

        <!-- Chilli body, integrated with the flame -->
        <path d="M43 31
                 C34 27 30 19 34 13
                 C39 17 42 20 44 24
                 C51 19 59 20 63 24
                 C54 25 49 29 48 35
                 C57 43 61 57 55 70
                 C51 80 43 88 32 93
                 C24 96 20 91 25 85
                 C34 75 37 65 36 56
                 C35 47 38 38 43 31Z"
              fill="url(#pepper)"
              stroke="#ffbc61"
              stroke-width="1.3"
              stroke-linejoin="round"/>

        <!-- Pepper highlight -->
        <path d="M40 38 C36 49 39 60 32 73"
              fill="none" stroke="#ffd19a"
              stroke-width="2.3" stroke-linecap="round"
              opacity=".85"/>

        <!-- Green chilli stem and leaf -->
        <path d="M43 30 C44 22 48 16 54 13"
              fill="none" stroke="url(#leaf)"
              stroke-width="5" stroke-linecap="round"/>

        <path d="M48 21
                 C51 12 63 10 69 14
                 C64 22 56 25 48 21Z"
              fill="url(#leaf)"/>

        <path d="M51 20 L64 15"
              fill="none" stroke="#d9ff9e"
              stroke-width="1.2" stroke-linecap="round"/>

        <!-- Ember details -->
        <path d="M78 35 L81 29 L84 35 L81 41Z" fill="#ffad4d"/>
        <circle cx="19" cy="47" r="2" fill="#ff6c38"/>
        <circle cx="74" cy="81" r="2" fill="#ffc05c"/>
      </svg>

      <div class="logo-caption">HOT V5</div>
    </div>

    <h1>
      <span class="chilli">CHILLI</span>
      <span class="hub">HUB</span>
      <span class="v5">V5</span>
    </h1>

    <div class="underline"></div>

    <p class="subtitle">
      Premium Key System<br>
      Your access key is ready.
    </p>

    <div class="status">
      <span class="status-dot"></span>
      KEY AVAILABLE
    </div>

    <div class="label">YOUR ACCESS KEY</div>

    <div class="key-box">
      <div class="key-text" id="keyText">ChilliHubV5KeybKaowiwMapwoiwjelLwpwojejeieb</div>
      <span class="key-icon">🔑</span>
    </div>

    <button class="copy-button" id="copyButton" type="button">
      <span id="buttonText">COPY KEY &nbsp; ↗</span>
    </button>

    <p class="message" id="message" role="status" aria-live="polite"></p>

    <div class="divider"></div>

    <p class="footer">
      POWERED BY <span>CHILLI HUB V5</span>
    </p>
  </section>
</main>

<script>
const key = "ChilliHubV5KeybKaowiwMapwoiwjelLwpwojejeieb";
const button = document.getElementById("copyButton");
const buttonText = document.getElementById("buttonText");
const message = document.getElementById("message");

button.addEventListener("click", async () => {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(key);
    } else {
      const area = document.createElement("textarea");
      area.value = key;
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.select();
      const success = document.execCommand("copy");
      area.remove();

      if (!success) throw new Error("Copy failed");
    }

    buttonText.textContent = "✓ COPIED SUCCESSFULLY";
    message.textContent = "Your key has been copied!";
    message.style.color = "#85f0ad";
  } catch {
    message.textContent = "Copy failed. Please select the key manually.";
    message.style.color = "#ff9380";
  }

  setTimeout(() => {
    buttonText.textContent = "COPY KEY  ↗";
  }, 2300);
});
</script>
</body>
</html>
